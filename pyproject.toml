# hlp-spice2x (spice2x to GP2040-CE Host Lighting bridge)
# Filename: pyproject.toml
# Folder: (repository root)
# https://github.com/djGLiTCH/hlp-spice2x
# SPDX-FileCopyrightText: (C) 2026 Jacob Simpson (DJ GLiTCH)
# SPDX-License-Identifier: GPL-3.0-or-later
# See LICENSES/GPL-3.0-or-later.txt at the repository root.

[build-system]
# 77 is where the SPDX license expression below became valid metadata
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hlp-spice2x"
version = "0.8.1"
description = "Drive a GP2040-CE board's LEDs from spice2x cabinet lighting"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [
    {name = "Jacob Simpson"},
]
requires-python = ">=3.14"
dependencies = ["gp2040ce-hostlighting @ git+https://github.com/djGLiTCH/gp2040ce-hostlighting@v1.0.0rc5"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Arcade",
    "Topic :: System :: Hardware",
]

[project.optional-dependencies]
dev = ["flake8", "flake8-docstrings", "flake8-pyproject", "pytest"]

[project.urls]
Homepage = "https://github.com/djGLiTCH/hlp-spice2x"

[project.scripts]
hlp-spice2x = "hlp_spice2x.__main__:main"

[tool.setuptools]
packages = ["hlp_spice2x"]

[tool.flake8]
max-line-length = 120
docstring-convention = "pep257"

[tool.pytest.ini_options]
testpaths = ["tests"]
